    ];
    const years = ['全部','2020','2021','2022','2023','2024','2025','2026','2027','2028'];
    const academies = ['全部','马克思主义学院','通识教育学院','信息工程学院','机械工程学院','电气工程学院','汽车工程学院','铁道工程学院','轨道交通学院','民航运输学院','财经商贸学院','智能制造学院','现代服务学院','交通物流学院','数字创意学院'];
    const nav = document.querySelector('.nav'); const hero = document.querySelector('.training-hero'); const menuToggle = document.querySelector('.menu-toggle'); const navLinks = document.querySelectorAll('.nav-links a'); const yearFilters = document.querySelector('#year-filters'); const academyFilters = document.querySelector('#academy-filters'); const planList = document.querySelector('#plan-list'); const resultStatus = document.querySelector('#result-status');
    let selectedYear = '全部'; let selectedAcademy = '全部';
    const createChip = (value, kind) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'filter-chip'; button.textContent = value; button.dataset.kind = kind; button.dataset.value = value; button.setAttribute('aria-pressed', String(value === '全部')); return button; };
    years.forEach((year) => yearFilters.append(createChip(year,'year'))); academies.forEach((academy) => academyFilters.append(createChip(academy,'academy')));
    function renderPlans() { const visible = records.filter((record) => (selectedYear === '全部' || record.year === selectedYear) && (selectedAcademy === '全部' || record.academy === selectedAcademy)); planList.innerHTML = visible.length ? visible.map((record) => `<li class="plan-row"><span class="plan-dot" aria-hidden="true"></span><div class="plan-main"><span class="academy-tag">${record.academy}</span><span class="plan-title">${record.title}</span></div><time class="plan-year" datetime="${record.year}">${record.year}</time></li>`).join('') : '<li class="empty-state">未找到符合当前筛选条件的人才培养方案。</li>'; resultStatus.textContent = `当前显示 ${visible.length} 条人才培养方案。`; }
    function syncChipState(group, selected) { group.querySelectorAll('.filter-chip').forEach((chip) => chip.setAttribute('aria-pressed', String(chip.dataset.value === selected))); }
    yearFilters.addEventListener('click',(event) => { const chip = event.target.closest('.filter-chip'); if (!chip) return; selectedYear = chip.dataset.value; syncChipState(yearFilters, selectedYear); renderPlans(); }); academyFilters.addEventListener('click',(event) => { const chip = event.target.closest('.filter-chip'); if (!chip) return; selectedAcademy = chip.dataset.value; syncChipState(academyFilters, selectedAcademy); renderPlans(); });
    document.querySelector('.search-form').addEventListener('submit',(event) => event.preventDefault());
    function syncNavState() { nav.classList.toggle('is-past-hero', hero.getBoundingClientRect().bottom <= nav.getBoundingClientRect().bottom); }
    syncNavState(); window.addEventListener('scroll',syncNavState,{passive:true}); window.addEventListener('resize',syncNavState);
    menuToggle.addEventListener('click',() => { const open = document.body.classList.toggle('nav-open'); menuToggle.setAttribute('aria-expanded',String(open)); menuToggle.setAttribute('aria-label',open ? '关闭导航菜单' : '打开导航菜单'); });
    navLinks.forEach((link) => link.addEventListener('click',() => { document.body.classList.remove('nav-open'); menuToggle.setAttribute('aria-expanded','false'); }));
    renderPlans();
  </script>
</body>
</html>
